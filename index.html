<script>
function closeZoom(){ document.getElementById('imgZoomModal').style.display='none'; }

async function doLogout(){ 
  if(!confirm("Logout karna hai?")) return;
  
  if(window.firebaseSignOut) await window.firebaseSignOut();

  localStorage.removeItem('bandua_logged_in');
  localStorage.removeItem('bandua_mpin');
  localStorage.removeItem('bandua_mobile');
  localStorage.removeItem('bandua_name');
  localStorage.removeItem('bandua_village');
  localStorage.removeItem('bandua_email');
  localStorage.removeItem('customer');
  
  localStorage.removeItem('sd_cart');
  localStorage.removeItem('custDist');
localStorage.removeItem('custDCharge');
localStorage.removeItem('custLat');
localStorage.removeItem('custLng');
  
  
  location.replace('signup.html');
}

// Google ko redirect mat karo, taaki wo site dekh sake
if(!localStorage.getItem('customer') && !navigator.userAgent.includes('Googlebot')){

}
