<script>
// Auto Location Update - sirf piche se, upar kuch nahi dikhega
function calcDistance(lat1, lon1, lat2, lon2){
  const R = 6371e3;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
async function getRoadDistance(lat1, lon1, lat2, lon2){
  try{
    let r = await fetch(`https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=false`);
    let j = await r.json();
    if(j.routes && j.routes[0]) return j.routes[0].distance;
  }catch(e){}
  return calcDistance(lat1, lon1, lat2, lon2);
}

async function autoUpdateLocation(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async p=>{
    let lat = p.coords.latitude, lng = p.coords.longitude;
    let dist = await getRoadDistance(22.615441, 85.934529, lat, lng);
    let dCharge = Math.round(5 + 0.005 * dist);
    localStorage.setItem('custLat', lat);
    localStorage.setItem('custLng', lng);
    localStorage.setItem('custDist', dist);
    localStorage.setItem('custDCharge', dCharge);
    if(window.updateCartUI) window.updateCartUI();
    if(window.renderCart) window.renderCart();
  }, e=>{}, {enableHighAccuracy:true, timeout:10000, maximumAge:0});
}
window.addEventListener('load', autoUpdateLocation);
</script>

<script>
// Loader tab tak ghumega jab tak Bill na dikhe
(function(){
  let loader = document.getElementById('orderLoader');
  let bill = document.getElementById('billPopup');
  if(!loader || !bill) return;

  // Bill dikhte hi Loader band karo
  let obs = new MutationObserver(()=>{
    if(bill.style.display === 'flex' || bill.style.display === 'block'){
      loader.style.display = 'none';
    }
  });
  obs.observe(bill, {attributes:true, attributeFilter:['style']});

  // Order button dabate hi Loader ON rahega
  let btn = document.getElementById('footerBtn');
  if(btn){
    btn.addEventListener('click', ()=>{
      loader.style.display = 'flex';
    });
  }
})();
</script>






<script>
// Products aate hi Gol-Gol band
(function(){
  let pLoader = document.getElementById('productLoader');
  let grid = document.getElementById('grid');
  if(!pLoader || !grid) return;

  let obs2 = new MutationObserver(()=>{
    if(grid.children.length > 0){
      pLoader.style.display = 'none';
    }
  });
  obs2.observe(grid, {childList:true});

  // Agar 10 sec me bhi saman na aaye to bhi band kar do, taaki khaali na lage
   setTimeout(()=>{
    if(grid.children.length === 0){
      pLoader.innerHTML = '<div style="text-align:center"> Clickable  <br><button onclick="location.reload()" style="background:#0e6a3c;color:white;padding:10px 20px;border:none;border-radius:10px;margin-top:10px;font-weight:bold">🔄 Data Connection chek kar ke   Refresh kijye</button></div>';
    }
  }, 10000);
 
 
})();
</script>
