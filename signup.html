<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup - BANDUA PUJA STORE</title>
<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top"><div class="brand"><h1>🛒 BANDUA PUJA STORE </h1><div class="loc">📍 Bandua</div></div></div>



<div class="signupWrap" id="signupWrap">
<h2 style="color:#0e6a3c">Customer Signup 🙏</h2>
<input id="sName" placeholder="Aapka Name*">
<input id="sPhone" placeholder="Mobile Number *">
<select id="sAdd" style="width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc">
<option value="">-- Village Chuniye --</option><option value="Bandua">Bandua</option>
</select>







<div style="padding: 12px 15px;">
  <button id="getLocationBtn" type="button" onclick="getLocation()" style="background:#0d6efd;color:white;padding:14px;width:100%;border:none;border-radius:12px;font-weight:bold;box-shadow:0 3px 9px rgba(0,0,0,0.15);word-spacing:6px;">
 📍 CURRENT  LOCATION  ON  KIJYE 
</button>
  
  <p id="locInfo" style="text-align:center;margin:6px 0 0 0;font-size:13px;"></p>
  
  
  <div id="locStatus" style="margin:8px 0;font-size:13px;color:green;text-align:center;"></div>
</div>




<button onclick="doSignup()">Save & Continue</button>
</div>



<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyBRZ86_UnSvgPBEImKCr1D4gDyZISvlf0U", authDomain: "subodh-dukan.firebaseapp.com", projectId: "subodh-dukan", storageBucket: "subodh-dukan.firebasestorage.app", messagingSenderId: "368451643879", appId: "1:368451643879:web:ee91ef9d797b480bd4b542" };



const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

async function sha256(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}

window.db = db;
window.doc = doc;
window.setDoc = setDoc;
window.getDoc = getDoc;
window.sha256 = sha256;
window.auth = auth;
window.provider = provider;
window.signInWithPopup = signInWithPopup;



window.loadVillages = async () => {
  const sel = document.getElementById("sAdd");
  try{
    const snap = await getDoc(doc(db,"settings","villages"));
    if(snap.exists() && snap.data().list && snap.data().list.length > 0){
      const list = snap.data().list;
      sel.innerHTML = '<option value="">-- Village Chuniye --</option>' + list.map(v=>`<option value="${v}">${v}</option>`).join("");
    }else{
      sel.innerHTML = '<option value="">-- Village Chuniye --</option>';
    }
  }catch(e){
    sel.innerHTML = '<option value="">-- Village Chuniye --</option>';
  }
}

window.loadVillages();



window.doSignup = async () => {

  let n = document.getElementById("sName").value.trim();
  
 
 let ph = document.getElementById("sPhone").value.replace(/\s/g, '').replace(/\D/g, '').slice(-10);
 
 
  let vil = document.getElementById("sAdd").value;
  if(!n) return alert("Naam likho");
  if(ph.length != 10) return alert("10 ank ka Mobile likho!");
  if(!vil) return alert("Gaon chuniye");
    let dd = parseFloat(localStorage.getItem('custDist') || 0);
  if(!dd || dd == 0){
    alert("Pehle 📍 CURRENT LOCATION ON KIJYE dabao!");
    return;
  }
  
  
  

  let email = localStorage.getItem("bandua_email") || "";
  localStorage.setItem("bandua_name", n);
  localStorage.setItem("bandua_mobile", ph);
  localStorage.setItem("bandua_village", vil);
  localStorage.setItem("customer", JSON.stringify({name:n, phone:ph, village:vil, email:email}));

  try{ await setDoc(doc(db, "customers", ph), { name: n, mobile: ph, village: vil, email: email, createdAt: new Date() }, {merge:true}); }catch(e){}


  location.href='index.html';
}

// YAHI MAIN FIX HAI - GitHub pe MPIN layega
window.addEventListener('load', () => {
  // Purana customer hai to form bhar do, wapas mat bhejo
  // Taaki Location dobara update ho sake
  try{
    let c = JSON.parse(localStorage.getItem('customer') || '{}');
    if(c.name) document.getElementById('sName').value = c.name;
    if(c.phone) document.getElementById('sPhone').value = c.phone;
    if(c.village) document.getElementById('sAdd').value = c.village;
  }catch(e){}
});










function calcDistance(lat1, lon1, lat2, lon2){
  const R = 6371e3;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
async function getRoadDistance(lat1, lon1, lat2, lon2){
  try{
    let r = await fetch(`https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=false`);
    let j = await r.json();
    if(j.routes && j.routes[0]) return j.routes[0].distance;
  }catch(e){}
  return calcDistance(lat1, lon1, lat2, lon2);
}
window.getLocation = async ()=>{
  let i=document.getElementById("locInfo"), s=document.getElementById("locStatus"), b=document.getElementById("getLocationBtn");
  if(i) i.innerText="📡 Location le rahe hain...";
  navigator.geolocation.getCurrentPosition(async p=>{
    let lat=p.coords.latitude, lng=p.coords.longitude;
    let dist = await getRoadDistance(22.615441, 85.934529, lat, lng);
    localStorage.setItem('custLat', lat);
    localStorage.setItem('custLng', lng);
    localStorage.setItem('custDist', dist);
    let dCharge = Math.round(5 + 0.005 * dist);
    localStorage.setItem('custDCharge', dCharge);
    if(s) s.innerText=`✅ Location Lock - ${(dist/1000).toFixed(2)} KM | Delivery ₹${dCharge}`;
   if(i) i.innerText="";
   
    if(b){ b.style.background="#198754"; b.innerText=`✅ LOCATION ON - ${(dist/1000).toFixed(2)} KM`; }
  },e=>{ if(i) i.innerText="❌ Location Allow karo"; },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
</script>
</body>
</html>
